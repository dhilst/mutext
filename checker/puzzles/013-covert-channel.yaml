    prose: "What rides `log-pad` arrives at `ntp-pool`."
    if: { category: carrier, item: "log-pad" }
    then: { category: sink, item: "ntp-pool" }

  - type: link
    post_number: 7
    prose: "Traffic reaching `cdn-edge` runs at `310 B/s`."
    if: { category: sink, item: "cdn-edge" }

name: "INC-0001 Tutorial"
dimensions: 3
size: 3

post:
  path: _posts/2026-05-15-tutorial.md
  panel_title: clues
  answer_order: [process, token, resource]
  narrative_only:
    5: "`token-beta` was invalid."
categories:
  - name: process
    items: ["parser", "crawler", "renderer"]
  - name: token
    items: ["token-alpha", "token-beta", "token-gamma"]
  - name: resource
    items: ["/cache", "/logs", "/models"]

answer:
  process: parser
  token: token-beta
  resource: /models

clues:
  - type: negation
    post_number: 1
    prose: "The `parser` was not using `token-alpha`."
    keep_redundant: true
    note: "Tutorial scaffolding: Bob walks the player through elimination, so the
      first clue restates what clues 2-4 already force."
    subject: { category: process, item: "parser" }
    object: { category: token, item: "token-alpha" }

  - type: link
    post_number: 2
    prose: "The process accessing `/cache` was using `token-gamma`."
    if: { category: resource, item: "/cache" }
    then: { category: token, item: "token-gamma" }

  - type: direct
    post_number: 3
    prose: "The `crawler` was accessing `/cache`."
    subject: { category: process, item: "crawler" }
    object: { category: resource, item: "/cache" }

  - type: link
    post_number: 4
    prose: "The process using `token-alpha` was accessing `/logs`."
    if: { category: token, item: "token-alpha" }
    then: { category: resource, item: "/logs" }

  # 5 is the culprit marker ("token-beta was invalid") — it names the answer row
  # rather than constraining the grid, so it is declared narrative-only above.

  - type: negation
    post_number: 6
    prose: "The `renderer` was not using `token-beta`."
    keep_redundant: true
    note: "Tutorial scaffolding: mutually entailed with clue 1; both are kept so the
      player can finish by elimination without backtracking."
    subject: { category: process, item: "renderer" }
    object: { category: token, item: "token-beta" }

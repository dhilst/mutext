  panel_title: evidence
  answer_order: [replica, digest, epoch, key, stream]

categories:
  - name: replica
    items: ["r1", "r2", "r3", "r4", "r5"]
  - name: digest
    items: ["d1", "d2", "d3", "d4", "d5"]
  - name: epoch
    items: ["e1", "e2", "e3", "e4", "e5"]
  - name: key
    items: ["k1", "k2", "k3", "k4", "k5"]
  - name: stream
    items: ["s1", "s2", "s3", "s4", "s5"]

answer:
  replica: r3
  digest: d5
  epoch: e4
  key: k4
  stream: s4

clues:
  - type: direct
    post_number: 1
    prose: "`r1` countersigns with `k1`."
    subject: { category: replica, item: "r1" }
    object: { category: key, item: "k1" }

  - type: direct
    post_number: 2
    prose: "`r1` attested in epoch `e5`."

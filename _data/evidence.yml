# Cross-chapter evidence ledger.
#
# Every string that more than one chapter has to agree on lives here and is
# rendered from here, so a chapter can never print a coordinate that a later
# chapter does not expect.  Build-time site data only — nothing is stored in a
# player's browser and nothing is served as an API.
#
# Keys are stable ids; see docs/story-graph.md for what each one is for.


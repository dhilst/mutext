<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body class="min-h-screen overflow-x-hidden">
    <div class="crt-overlay" aria-hidden="true"></div>
    <div class="scanline" aria-hidden="true"></div>

    <div class="min-h-screen">
      <header class="sticky top-0 z-50 border-b border-cyan-trace/15 bg-void/92 backdrop-blur">
        <nav class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 sm:px-6 lg:px-8" aria-label="Primary navigation">
          <a class="group flex items-center gap-3 text-white" href="{{ '/' | relative_url }}">
            <span class="flex h-9 w-9 items-center justify-center border border-cyan-trace/35 bg-cyan-trace/10 font-mono text-lg font-bold text-cyan-trace shadow-glow">μ</span>
            <span class="leading-tight">
              <span class="block font-mono text-sm font-semibold">μ-text</span>
              <span class="block text-xs text-slate-mutext">AI-native software solutions.</span>
            </span>
          </a>

          <div class="hidden items-center gap-1 sm:flex">
            <a class="button-quiet" href="{{ '/archive.html' | relative_url }}">Archive</a>
            <a class="button-quiet" href="{{ '/about.html' | relative_url }}">About</a>
          </div>

          <div class="flex items-center gap-2 font-mono text-xs text-slate-mutext">
            <span class="status-dot"></span>
            <span class="hidden sm:inline">OPS LINK</span>
          </div>
        </nav>
        <div class="mx-auto flex max-w-7xl gap-2 overflow-x-auto px-4 pb-3 sm:hidden">
          <a class="button-quiet shrink-0" href="{{ '/archive.html' | relative_url }}">Archive</a>
          <a class="button-quiet shrink-0" href="{{ '/about.html' | relative_url }}">About</a>
        </div>
      </header>

      <div class="mx-auto max-w-7xl px-4 py-5 sm:px-6 lg:px-8">
        <main id="content" class="min-w-0">
          {{ content }}
        </main>
      </div>

      <footer class="mx-auto max-w-7xl px-4 pb-8 pt-2 sm:px-6 lg:px-8">
        <div class="flex flex-col gap-2 border-t border-cyan-trace/15 pt-4 font-mono text-xs text-slate-mutext sm:flex-row sm:items-center sm:justify-between">
          <span>μ-text internal console v0.1.0</span>
          <span>© 2026 μ-text Systems, Generated fast. Fixed faster.</span>
        </div>
      </footer>
    </div>

    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </body>
</html>
